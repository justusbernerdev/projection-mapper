<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projection Mapper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #1a1a24;
      --bg-panel: #22222e;
      --bg-darker: #14141c;
      --border: rgba(255,255,255,0.08);
      --border-light: rgba(255,255,255,0.12);
      --accent: #00b4ff;
      --accent-dim: rgba(0,180,255,0.15);
      --text: #ccc;
      --text-dim: #666;
      --text-label: #888;
      --green: #00cc66;
      --red: #ff3344;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      font-size: 13px;
    }

    /* ── LAYOUT ── */
    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }
    #left-panel {
      width: 240px;
      min-width: 240px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #toolbar {
      height: 36px;
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      flex-shrink: 0;
    }
    #canvas-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0a0a0f;
    }
    #stage {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    #right-panel {
      width: 260px;
      min-width: 260px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      z-index: 100;
    }
    #bottom-bar {
      height: 28px;
      background: var(--bg-darker);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 11px;
      color: var(--text-dim);
      gap: 16px;
      flex-shrink: 0;
    }

    /* ── TOOLBAR ── */
    .tb-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text);
      padding: 4px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tb-btn:hover { background: rgba(255,255,255,0.06); }
    .tb-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    .tb-mode {
      padding: 3px 10px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      user-select: none;
    }
    .tb-mode:hover { filter: brightness(1.3); }
    .tb-mode.edit { background: var(--accent-dim); color: var(--accent); }
    .tb-mode.program { background: rgba(160,80,255,0.2); color: #a050ff; }
    .tb-mode.go { background: rgba(0,200,80,0.2); color: var(--green); }
    .tb-mode.performance { background: rgba(255,50,50,0.2); color: var(--red); }
    .tp-item {
      padding: 5px 14px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tp-item:hover { background: rgba(255,255,255,0.08); }
    .tp-item.active { color: var(--accent); background: var(--accent-dim); }

    /* ── LEFT PANEL ── */
    .panel-header {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0 4px;
    }
    .panel-header button:hover { color: #fff; }
    #surface-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .sf-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .sf-item:hover { background: rgba(255,255,255,0.03); }
    .sf-item.selected {
      background: var(--accent-dim);
      border-left-color: var(--accent);
    }
    .sf-vis {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--text-dim);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .sf-vis.on {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 6px rgba(0,180,255,0.4);
    }
    .sf-color {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .sf-name {
      flex: 1;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sf-type {
      font-size: 10px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .sf-del {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .sf-item:hover .sf-del, .sf-item:hover .sf-lock { opacity: 1; }
    .sf-del:hover { color: var(--red); }
    .sf-lock:hover { color: var(--accent) !important; }

    /* ── OUTPUT LIST ── */
    .out-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      font-size: 12px;
      border-left: 3px solid transparent;
    }
    .out-item:hover { background: rgba(255,255,255,0.03); }
    .out-status {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .out-status.open { background: var(--green); box-shadow: 0 0 4px var(--green); }
    .out-status.closed { background: var(--text-dim); }
    .out-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      background: transparent; border: none; color: var(--text); font-size: 12px;
      padding: 2px 4px; outline: none;
    }
    .out-name:focus { background: rgba(255,255,255,0.05); border-radius: 2px; }
    .out-res { font-size: 10px; color: var(--text-dim); flex-shrink: 0; }
    .out-open {
      background: none; border: 1px solid var(--border-light); color: var(--accent);
      padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 10px;
    }
    .out-open:hover { background: var(--accent-dim); }
    .out-del {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 14px; opacity: 0;
    }
    .out-item:hover .out-del { opacity: 1; }

    /* ── CUE LIST (bottom of left panel) ── */
    #cue-panel {
      border-top: 1px solid var(--border);
      max-height: 40%;
      overflow-y: auto;
    }
    .cue-controls {
      display: flex;
      gap: 4px;
      padding: 6px 10px;
    }
    .cue-controls button {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }
    .cue-controls button:hover { background: rgba(255,255,255,0.12); }
    .cue-controls .go-btn {
      background: rgba(0,200,80,0.15);
      border-color: rgba(0,200,80,0.3);
      color: var(--green);
      font-weight: 600;
    }
    .cue-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
      border-left: 3px solid transparent;
    }
    .cue-item:hover { background: rgba(255,255,255,0.03); }
    .cue-item.active {
      background: rgba(0,200,80,0.08);
      border-left-color: var(--green);
    }
    .cue-num { color: var(--text-dim); width: 22px; font-size: 11px; }
    .cue-name-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12px;
      padding: 2px 4px;
      outline: none;
    }
    .cue-name-input:focus { background: rgba(255,255,255,0.05); border-radius: 2px; }
    .cue-del {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 12px; opacity: 0;
    }
    .cue-item:hover .cue-del { opacity: 1; }

    /* ── RIGHT PANEL (properties) ── */
    .prop-section {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .prop-section h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .prop-row {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }
    .prop-row label {
      font-size: 11px;
      color: var(--text-label);
      width: 70px;
      flex-shrink: 0;
    }
    .prop-row input, .prop-row select, .prop-row textarea {
      flex: 1;
      min-width: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-light);
      color: var(--text);
      padding: 4px 6px;
      border-radius: 3px;
      font-size: 12px;
      font-family: inherit;
    }
    .prop-row input:focus, .prop-row select:focus, .prop-row textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .prop-row input[type="color"] {
      width: 32px;
      height: 24px;
      padding: 1px;
      cursor: pointer;
      flex: 0;
    }
    .prop-row input[type="range"] {
      padding: 0;
      accent-color: var(--accent);
    }
    .prop-row input[type="checkbox"] {
      width: auto;
      flex: 0;
      accent-color: var(--accent);
    }
    .prop-row .val {
      font-size: 11px;
      color: var(--text-dim);
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }
    .prop-btn {
      width: 100%;
      padding: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-light);
      color: var(--text);
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 4px;
    }
    .prop-btn:hover { background: rgba(255,255,255,0.12); }
    .prop-btn.primary {
      background: var(--accent-dim);
      border-color: rgba(0,180,255,0.3);
      color: var(--accent);
    }

    /* ── CANVAS GRID ── */
    #canvas-grid {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ── SURFACE IN CANVAS ── */
    .surface-container {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
    }
    .surface-content {
      width: 100%;
      height: 100%;
    }
    .corner-handle {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      cursor: grab;
      transform: translate(-50%, -50%);
      z-index: 1000;
      pointer-events: all;
      box-shadow: 0 0 4px rgba(0,0,0,0.6);
    }
    .corner-handle:hover {
      background: #fff;
      transform: translate(-50%, -50%) scale(1.3);
    }
    .corner-handle.dragging {
      cursor: grabbing;
      background: #ff0;
    }
    .surface-label {
      position: absolute;
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      pointer-events: none;
      z-index: 1001;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* ── HIDDEN IN PERFORMANCE ── */
    body.performance-mode #left-panel,
    body.performance-mode #right-panel,
    body.performance-mode #toolbar,
    body.performance-mode #bottom-bar,
    body.performance-mode .corner-handle,
    body.performance-mode .surface-label {
      display: none !important;
    }
    body.performance-mode #canvas-area {
      background: #000;
    }
    body.performance-mode {
      cursor: none;
      background: #000;
    }
    body.performance-mode #center {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    /* Hide panels when toggled */
    #left-panel.hidden { display: none; }
    #right-panel.hidden { display: none; }

    /* ── PROGRAM MODE ── */
    .tb-mode.program { background: rgba(180,100,255,0.2); color: #b464ff; }

    #program-panel {
      flex-direction: column;
      background: var(--bg-darker);
      border-top: 1px solid var(--border);
      min-height: 40%;
      max-height: 50%;
      overflow-y: auto;
      z-index: 50;
    }
    .prog-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .prog-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #b464ff;
    }
    .prog-counter {
      font-size: 13px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .prog-bpm {
      font-size: 11px;
      color: var(--text-dim);
      padding: 2px 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
    }
    .prog-go-btn {
      margin-left: auto;
      background: rgba(0,200,80,0.2);
      border: 1px solid rgba(0,200,80,0.4);
      color: var(--green);
      font-size: 15px;
      font-weight: 700;
      padding: 6px 24px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .prog-go-btn:hover { background: rgba(0,200,80,0.35); }
    .prog-back-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-light);
      color: var(--text);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .prog-back-btn:hover { background: rgba(255,255,255,0.12); }
    .prog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      padding: 12px 16px;
      flex: 1;
    }
    .prog-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 72px;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
      padding: 6px;
    }
    .prog-tile:hover {
      transform: scale(1.04);
      box-shadow: 0 0 12px rgba(255,255,255,0.1);
    }
    .prog-tile.active {
      border-color: var(--green) !important;
      box-shadow: 0 0 16px rgba(0,200,80,0.4), inset 0 0 12px rgba(0,200,80,0.15);
    }
    .prog-tile-num {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      font-weight: 600;
    }
    .prog-tile-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .prog-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(0,0,0,0.3);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .prog-controls input[type="color"] {
      width: 28px; height: 24px; padding: 1px; border: 1px solid var(--border-light);
      border-radius: 3px; cursor: pointer; background: transparent;
    }
    .prog-controls input[type="range"] { accent-color: var(--accent); }
    .prog-stop-btn {
      margin-left: auto;
      padding: 4px 12px;
      background: rgba(255,50,50,0.2);
      border: 1px solid rgba(255,50,50,0.4);
      color: var(--red);
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .prog-stop-btn:hover { background: rgba(255,50,50,0.3); }
    .prog-tile-fade {
      font-size: 9px;
      color: rgba(255,255,255,0.4);
    }

    /* ── EXECUTOR GRID ── */
    .prog-executor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 4px;
      padding: 8px;
      flex: 1;
      overflow-y: auto;
      align-content: start;
    }
    .prog-exec-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 56px;
      border: 2px solid color-mix(in srgb, var(--exec-color) 40%, transparent);
      border-radius: 5px;
      background: color-mix(in srgb, var(--exec-color) 8%, transparent);
      cursor: pointer;
      transition: all 0.1s;
      padding: 4px;
    }
    .prog-exec-btn:hover {
      background: color-mix(in srgb, var(--exec-color) 18%, transparent);
      transform: scale(1.03);
    }
    .prog-exec-btn:active {
      transform: scale(0.97);
      background: color-mix(in srgb, var(--exec-color) 30%, transparent);
    }
    .prog-exec-btn.active {
      border-color: var(--green);
      box-shadow: 0 0 10px rgba(0,200,80,0.4), inset 0 0 8px rgba(0,200,80,0.1);
    }
    .prog-exec-key {
      font-size: 9px;
      color: rgba(255,255,255,0.35);
      font-family: monospace;
    }
    .prog-exec-label {
      font-size: 10px;
      font-weight: 600;
      color: #ddd;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    /* Page tabs */
    .prog-page-tab {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 3px 10px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
    }
    .prog-page-tab:hover { background: rgba(255,255,255,0.08); }
    .prog-page-tab.active {
      background: rgba(160,80,255,0.15);
      border-color: rgba(160,80,255,0.4);
      color: #b464ff;
    }

    /* ── PROGRAM TARGET LIST ── */
    .prog-target {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      margin-bottom: 2px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .prog-target:hover { background: rgba(255,255,255,0.05); }
    .prog-target.active {
      background: var(--accent-dim);
      border-left-color: var(--accent);
      color: var(--accent);
    }
    .prog-target.sub {
      padding-left: 22px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .prog-target.sub.active { color: var(--accent); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div id="app">
    <!-- LEFT PANEL -->
    <div id="left-panel">
      <div id="surface-panel-header" class="panel-header">
        Surfaces <button id="btn-add-surface" title="Add surface">+</button>
      </div>
      <div id="surface-list"></div>
      <div id="group-actions" style="padding:4px 10px;display:flex;gap:4px;">
        <button id="btn-group-selected" class="prop-btn" style="flex:1;font-size:11px;padding:4px;">Group Selected</button>
      </div>
      <div id="group-list" style="border-top:1px solid var(--border);"></div>
      <div id="output-panel" style="border-top:1px solid var(--border);">
        <div class="panel-header">Outputs <button id="btn-add-output" title="Add output">+</button></div>
        <div id="output-list"></div>
      </div>
      <div id="cue-panel">
        <div class="panel-header">Cue List <button id="btn-capture-cue" title="Capture cue">+</button></div>
        <div class="cue-controls">
          <button id="btn-prev-cue">&larr;</button>
          <button id="btn-next-cue" class="go-btn">GO &rarr;</button>
        </div>
        <div id="cue-items"></div>
      </div>
    </div>

    <!-- CENTER -->
    <div id="center">
      <div id="toolbar">
        <span id="mode-indicator" class="tb-mode edit">EDIT</span>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="tb-output" title="Open output window">Output</button>
        <button class="tb-btn" id="tb-remote" title="Open remote control">Remote</button>
        <button class="tb-btn" id="tb-executor" title="Open executor">Executor</button>
        <button class="tb-btn" id="tb-status" title="Network status">Status</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="tb-grid" title="Toggle grid">Grid</button>
        <div class="tb-sep"></div>
        <div style="position:relative;">
          <button class="tb-btn" id="tb-test" title="Test patterns">Test &#9660;</button>
          <div id="test-pattern-menu" style="display:none;position:absolute;top:100%;left:0;background:var(--bg-panel);border:1px solid var(--border-light);border-radius:4px;padding:4px 0;min-width:140px;z-index:200;margin-top:2px;">
            <div class="tp-item" data-pattern="checkerboard">Checkerboard</div>
            <div class="tp-item" data-pattern="grid">Grid</div>
            <div class="tp-item" data-pattern="colorBars">Color Bars</div>
            <div class="tp-item" data-pattern="gradient">Gradient</div>
            <div class="tp-item" data-pattern="white">White</div>
            <div class="tp-item" data-pattern="numbering">Numbering</div>
            <div class="tp-item" data-pattern="crosshatch">Crosshatch</div>
            <div class="tp-item" data-pattern="circle">Circle</div>
          </div>
        </div>
        <button class="tb-btn" id="tb-clear-test" title="Clear test pattern" style="display:none;">Clear Test</button>
        <div style="flex:1"></div>
        <button class="tb-btn" id="tb-zoom-in" title="Zoom in (+)">+</button>
        <button class="tb-btn" id="tb-zoom-reset" title="Reset view (Alt+dblclick)">Fit</button>
        <button class="tb-btn" id="tb-zoom-out" title="Zoom out (-)">−</button>
        <span id="zoom-level" style="font-size:11px;color:var(--text-dim);min-width:40px;text-align:center;">100%</span>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="tb-play" style="font-weight:bold;">&#9654; Play</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="tb-blackout" style="color:var(--red)">Blackout</button>
        <button class="tb-btn" id="tb-fullscreen">Fullscreen</button>
      </div>
      <div id="canvas-area">
        <canvas id="canvas-grid"></canvas>
        <div id="stage"></div>
      </div>
      <div id="program-panel" style="display:none;"></div>
      <div id="bottom-bar">
        <span id="status-mode">Edit Mode</span>
        <span id="status-surfaces">0 surfaces</span>
        <span id="status-cue">No cue</span>
        <span style="flex:1"></span>
        <span>Tab: mode | Arrows: cues | F: fullscreen</span>
      </div>
    </div>

    <!-- RIGHT PANEL (properties) -->
    <div id="right-panel">
      <div id="props-content"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
