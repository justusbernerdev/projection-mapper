<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projection Output</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .surface-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }
    .surface-content {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module" src="/src/output.js"></script>
</body>
</html>
