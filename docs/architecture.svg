<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'SF Pro Display', -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="grad-control" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="grad-server" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0e2a1e"/>
    </linearGradient>
    <linearGradient id="grad-output" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="100%" stop-color="#2a1e0e"/>
    </linearGradient>
    <linearGradient id="grad-remote" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a3a"/>
      <stop offset="100%" stop-color="#1e0e2a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0a0a12" rx="12"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" fill="#888" font-size="13" font-weight="600" letter-spacing="3">PROJECTION MAPPER — SYSTEM ARCHITECTURE</text>

  <!-- ═══ CONTROL PC ═══ -->
  <g filter="url(#shadow)">
    <rect x="380" y="60" width="440" height="200" rx="10" fill="url(#grad-control)" stroke="#4455aa" stroke-width="2"/>
  </g>
  <text x="600" y="84" text-anchor="middle" fill="#6688ff" font-size="11" font-weight="700" letter-spacing="2">CONTROL PC</text>

  <!-- Editor -->
  <rect x="400" y="96" width="120" height="60" rx="6" fill="#1a1a30" stroke="#445" stroke-width="1"/>
  <text x="460" y="120" text-anchor="middle" fill="#aab" font-size="10" font-weight="600">EDITOR</text>
  <text x="460" y="134" text-anchor="middle" fill="#667" font-size="9">Setup / Program</text>
  <text x="460" y="146" text-anchor="middle" fill="#556" font-size="8">:5173</text>

  <!-- WS Server -->
  <rect x="540" y="96" width="120" height="60" rx="6" fill="#0e2a1e" stroke="#2a6" stroke-width="1.5"/>
  <text x="600" y="120" text-anchor="middle" fill="#4d8" font-size="10" font-weight="600">WS SERVER</text>
  <text x="600" y="134" text-anchor="middle" fill="#396" font-size="9">Node.js</text>
  <text x="600" y="146" text-anchor="middle" fill="#285" font-size="8">:9100</text>

  <!-- Vite -->
  <rect x="680" y="96" width="120" height="60" rx="6" fill="#1a1a30" stroke="#445" stroke-width="1"/>
  <text x="740" y="120" text-anchor="middle" fill="#aab" font-size="10" font-weight="600">VITE DEV</text>
  <text x="740" y="134" text-anchor="middle" fill="#667" font-size="9">HTTP Server</text>
  <text x="740" y="146" text-anchor="middle" fill="#556" font-size="8">:5173</text>

  <!-- State/Transport -->
  <rect x="400" y="170" width="400" height="36" rx="4" fill="rgba(0,180,255,0.08)" stroke="rgba(0,180,255,0.2)" stroke-width="1"/>
  <text x="600" y="192" text-anchor="middle" fill="#0af" font-size="10">BroadcastChannel (local) + WebSocket (network)</text>

  <!-- Auto-save -->
  <rect x="400" y="216" width="130" height="28" rx="4" fill="rgba(255,200,50,0.08)" stroke="rgba(255,200,50,0.15)" stroke-width="1"/>
  <text x="465" y="234" text-anchor="middle" fill="#ca8" font-size="9">Auto-save → IndexedDB</text>

  <!-- State broadcast -->
  <rect x="550" y="216" width="250" height="28" rx="4" fill="rgba(0,200,100,0.08)" stroke="rgba(0,200,100,0.15)" stroke-width="1"/>
  <text x="675" y="234" text-anchor="middle" fill="#6a6" font-size="9">State broadcast 30fps → all clients</text>

  <!-- ═══ NETWORK SWITCH ═══ -->
  <rect x="490" y="290" width="220" height="40" rx="6" fill="#1a2a1a" stroke="#2a6" stroke-width="1.5"/>
  <text x="600" y="315" text-anchor="middle" fill="#4d8" font-size="11" font-weight="600">ETHERNET SWITCH</text>

  <!-- Lines from Control PC to Switch -->
  <line x1="600" y1="260" x2="600" y2="290" stroke="#2a6" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ═══ OUTPUT MACHINES ═══ -->

  <!-- Output 1 - Laptop -->
  <g filter="url(#shadow)">
    <rect x="40" y="400" width="200" height="140" rx="8" fill="url(#grad-output)" stroke="#c84" stroke-width="1.5"/>
  </g>
  <text x="140" y="422" text-anchor="middle" fill="#fa6" font-size="10" font-weight="700" letter-spacing="1">OUTPUT 1</text>
  <rect x="60" y="434" width="160" height="50" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="140" y="455" text-anchor="middle" fill="#888" font-size="9">Chrome Kiosk</text>
  <text x="140" y="468" text-anchor="middle" fill="#555" font-size="8">/output.html</text>
  <text x="140" y="500" text-anchor="middle" fill="#a86" font-size="9" font-weight="600">💻 Laptop</text>
  <text x="140" y="516" text-anchor="middle" fill="#776" font-size="8">HDMI → Projector 1</text>
  <text x="140" y="530" text-anchor="middle" fill="#665" font-size="8">1920×1080</text>

  <!-- Output 2 - Raspberry Pi -->
  <g filter="url(#shadow)">
    <rect x="280" y="400" width="200" height="140" rx="8" fill="url(#grad-output)" stroke="#c84" stroke-width="1.5"/>
  </g>
  <text x="380" y="422" text-anchor="middle" fill="#fa6" font-size="10" font-weight="700" letter-spacing="1">OUTPUT 2</text>
  <rect x="300" y="434" width="160" height="50" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="380" y="455" text-anchor="middle" fill="#888" font-size="9">Chromium Kiosk</text>
  <text x="380" y="468" text-anchor="middle" fill="#555" font-size="8">/output.html</text>
  <text x="380" y="500" text-anchor="middle" fill="#a86" font-size="9" font-weight="600">🍓 Raspberry Pi 5</text>
  <text x="380" y="516" text-anchor="middle" fill="#776" font-size="8">HDMI → Projector 2</text>
  <text x="380" y="530" text-anchor="middle" fill="#665" font-size="8">1920×1080</text>

  <!-- Output 3 - NUC -->
  <g filter="url(#shadow)">
    <rect x="520" y="400" width="200" height="140" rx="8" fill="url(#grad-output)" stroke="#c84" stroke-width="1.5"/>
  </g>
  <text x="620" y="422" text-anchor="middle" fill="#fa6" font-size="10" font-weight="700" letter-spacing="1">OUTPUT 3</text>
  <rect x="540" y="434" width="160" height="50" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="620" y="455" text-anchor="middle" fill="#888" font-size="9">Chrome Kiosk</text>
  <text x="620" y="468" text-anchor="middle" fill="#555" font-size="8">/output.html</text>
  <text x="620" y="500" text-anchor="middle" fill="#a86" font-size="9" font-weight="600">🖥 Intel NUC</text>
  <text x="620" y="516" text-anchor="middle" fill="#776" font-size="8">HDMI → Projector 3</text>
  <text x="620" y="530" text-anchor="middle" fill="#665" font-size="8">3840×2160</text>

  <!-- Output 4 - Server -->
  <g filter="url(#shadow)">
    <rect x="760" y="400" width="200" height="140" rx="8" fill="url(#grad-output)" stroke="#c84" stroke-width="1.5"/>
  </g>
  <text x="860" y="422" text-anchor="middle" fill="#fa6" font-size="10" font-weight="700" letter-spacing="1">OUTPUT 4</text>
  <rect x="780" y="434" width="160" height="50" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="860" y="455" text-anchor="middle" fill="#888" font-size="9">Chrome Kiosk</text>
  <text x="860" y="468" text-anchor="middle" fill="#555" font-size="8">/output.html</text>
  <text x="860" y="500" text-anchor="middle" fill="#a86" font-size="9" font-weight="600">🖳 Linux Server</text>
  <text x="860" y="516" text-anchor="middle" fill="#776" font-size="8">HDMI → LED Wall</text>
  <text x="860" y="530" text-anchor="middle" fill="#665" font-size="8">1920×1080</text>

  <!-- Lines from Switch to Outputs -->
  <line x1="490" y1="310" x2="140" y2="310" stroke="#2a6" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="140" y1="310" x2="140" y2="400" stroke="#2a6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="490" y1="320" x2="380" y2="320" stroke="#2a6" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="380" y1="320" x2="380" y2="400" stroke="#2a6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="620" y1="330" x2="620" y2="400" stroke="#2a6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="710" y1="320" x2="860" y2="320" stroke="#2a6" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="860" y1="320" x2="860" y2="400" stroke="#2a6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Cable labels -->
  <text x="300" y="305" text-anchor="middle" fill="#396" font-size="8">CAT6</text>
  <text x="500" y="370" text-anchor="middle" fill="#396" font-size="8">CAT6</text>
  <text x="780" y="305" text-anchor="middle" fill="#396" font-size="8">CAT6</text>

  <!-- ═══ PROJECTORS ═══ -->
  <g>
    <rect x="80" y="560" width="120" height="44" rx="6" fill="#222" stroke="#555" stroke-width="1"/>
    <text x="140" y="578" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">PROJECTOR 1</text>
    <text x="140" y="594" text-anchor="middle" fill="#666" font-size="8">Front wall</text>
    <line x1="140" y1="540" x2="140" y2="560" stroke="#555" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="320" y="560" width="120" height="44" rx="6" fill="#222" stroke="#555" stroke-width="1"/>
    <text x="380" y="578" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">PROJECTOR 2</text>
    <text x="380" y="594" text-anchor="middle" fill="#666" font-size="8">Side wall</text>
    <line x1="380" y1="540" x2="380" y2="560" stroke="#555" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="560" y="560" width="120" height="44" rx="6" fill="#222" stroke="#555" stroke-width="1"/>
    <text x="620" y="578" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">PROJECTOR 3</text>
    <text x="620" y="594" text-anchor="middle" fill="#666" font-size="8">Ceiling</text>
    <line x1="620" y1="540" x2="620" y2="560" stroke="#555" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="800" y="560" width="120" height="44" rx="6" fill="#222" stroke="#555" stroke-width="1"/>
    <text x="860" y="578" text-anchor="middle" fill="#aaa" font-size="9" font-weight="600">LED WALL</text>
    <text x="860" y="594" text-anchor="middle" fill="#666" font-size="8">Stage back</text>
    <line x1="860" y1="540" x2="860" y2="560" stroke="#555" stroke-width="1.5"/>
  </g>

  <!-- ═══ WIFI ═══ -->
  <rect x="980" y="285" width="180" height="50" rx="6" fill="#1a1a2a" stroke="#558" stroke-width="1"/>
  <text x="1070" y="307" text-anchor="middle" fill="#88a" font-size="10" font-weight="600">📡 WIFI ROUTER</text>
  <text x="1070" y="322" text-anchor="middle" fill="#556" font-size="8">Same subnet as LAN</text>
  <line x1="710" y1="310" x2="980" y2="310" stroke="#558" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ═══ REMOTE CONTROLS ═══ -->

  <!-- Phone Remote -->
  <g filter="url(#shadow)">
    <rect x="970" y="400" width="90" height="130" rx="8" fill="url(#grad-remote)" stroke="#a4c" stroke-width="1.5"/>
  </g>
  <text x="1015" y="420" text-anchor="middle" fill="#c6e" font-size="9" font-weight="700" letter-spacing="1">REMOTE</text>
  <rect x="982" y="430" width="66" height="46" rx="3" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="1015" y="450" text-anchor="middle" fill="#888" font-size="8">GO NEXT</text>
  <text x="1015" y="463" text-anchor="middle" fill="#555" font-size="7">Cues / BO</text>
  <text x="1015" y="492" text-anchor="middle" fill="#a6c" font-size="9">📱 Phone</text>
  <text x="1015" y="506" text-anchor="middle" fill="#776" font-size="8">/remote.html</text>
  <text x="1015" y="520" text-anchor="middle" fill="#665" font-size="7">WiFi</text>

  <!-- Tablet Executor -->
  <g filter="url(#shadow)">
    <rect x="1080" y="400" width="100" height="130" rx="8" fill="url(#grad-remote)" stroke="#a4c" stroke-width="1.5"/>
  </g>
  <text x="1130" y="420" text-anchor="middle" fill="#c6e" font-size="9" font-weight="700" letter-spacing="1">EXECUTOR</text>
  <rect x="1092" y="430" width="76" height="46" rx="3" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="1130" y="448" text-anchor="middle" fill="#888" font-size="7">Scene Grid</text>
  <text x="1130" y="458" text-anchor="middle" fill="#555" font-size="7">Overlays</text>
  <text x="1130" y="468" text-anchor="middle" fill="#555" font-size="7">Faders</text>
  <text x="1130" y="492" text-anchor="middle" fill="#a6c" font-size="9">📱 Tablet</text>
  <text x="1130" y="506" text-anchor="middle" fill="#776" font-size="8">/executor.html</text>
  <text x="1130" y="520" text-anchor="middle" fill="#665" font-size="7">WiFi</text>

  <!-- Lines WiFi to remotes -->
  <line x1="1015" y1="335" x2="1015" y2="400" stroke="#a4c" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1070" y1="335" x2="1130" y2="400" stroke="#a4c" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ═══ MIDI CONTROLLER ═══ -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="280" height="110" rx="8" fill="#1a1a24" stroke="#886" stroke-width="1.5"/>
  </g>
  <text x="180" y="142" text-anchor="middle" fill="#ca8" font-size="10" font-weight="700" letter-spacing="1">MIDI CONTROLLER</text>

  <!-- Pad grid -->
  <g>
    <rect x="60" y="154" width="18" height="14" rx="2" fill="#c33" stroke="#a22" stroke-width="0.5"/>
    <rect x="82" y="154" width="18" height="14" rx="2" fill="#3a3" stroke="#292" stroke-width="0.5"/>
    <rect x="104" y="154" width="18" height="14" rx="2" fill="#33c" stroke="#22a" stroke-width="0.5"/>
    <rect x="126" y="154" width="18" height="14" rx="2" fill="#cc3" stroke="#aa2" stroke-width="0.5"/>
    <rect x="148" y="154" width="18" height="14" rx="2" fill="#3cc" stroke="#2aa" stroke-width="0.5"/>
    <rect x="170" y="154" width="18" height="14" rx="2" fill="#c3c" stroke="#a2a" stroke-width="0.5"/>
    <rect x="192" y="154" width="18" height="14" rx="2" fill="#c63" stroke="#a42" stroke-width="0.5"/>
    <rect x="214" y="154" width="18" height="14" rx="2" fill="#36c" stroke="#24a" stroke-width="0.5"/>
    <rect x="60" y="172" width="18" height="14" rx="2" fill="#663" stroke="#442" stroke-width="0.5"/>
    <rect x="82" y="172" width="18" height="14" rx="2" fill="#366" stroke="#244" stroke-width="0.5"/>
    <rect x="104" y="172" width="18" height="14" rx="2" fill="#636" stroke="#424" stroke-width="0.5"/>
    <rect x="126" y="172" width="18" height="14" rx="2" fill="#c93" stroke="#a72" stroke-width="0.5"/>
    <rect x="148" y="172" width="18" height="14" rx="2" fill="#39c" stroke="#27a" stroke-width="0.5"/>
    <rect x="170" y="172" width="18" height="14" rx="2" fill="#c39" stroke="#a27" stroke-width="0.5"/>
    <rect x="192" y="172" width="18" height="14" rx="2" fill="#c00" stroke="#a00" stroke-width="0.5"/>
    <rect x="214" y="172" width="18" height="14" rx="2" fill="#09c" stroke="#07a" stroke-width="0.5"/>
  </g>

  <!-- Faders -->
  <g>
    <rect x="248" y="154" width="8" height="34" rx="2" fill="#222" stroke="#444" stroke-width="0.5"/>
    <rect x="249" y="168" width="6" height="8" rx="1" fill="#888"/>
    <rect x="262" y="154" width="8" height="34" rx="2" fill="#222" stroke="#444" stroke-width="0.5"/>
    <rect x="263" y="160" width="6" height="8" rx="1" fill="#888"/>
    <rect x="276" y="154" width="8" height="34" rx="2" fill="#222" stroke="#444" stroke-width="0.5"/>
    <rect x="277" y="174" width="6" height="8" rx="1" fill="#888"/>
    <rect x="290" y="154" width="8" height="34" rx="2" fill="#222" stroke="#444" stroke-width="0.5"/>
    <rect x="291" y="164" width="6" height="8" rx="1" fill="#888"/>
  </g>

  <text x="140" y="204" text-anchor="middle" fill="#887" font-size="8">Pads → Scenes / Overlays</text>
  <text x="278" y="204" text-anchor="middle" fill="#887" font-size="8">CC → BPM / Opacity</text>
  <text x="180" y="220" text-anchor="middle" fill="#665" font-size="8">USB → Control PC (Web MIDI API)</text>

  <!-- Line MIDI to Control PC -->
  <line x1="320" y1="175" x2="380" y2="160" stroke="#886" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="345" y="160" text-anchor="middle" fill="#886" font-size="7">USB</text>

  <!-- ═══ PROTOCOL LEGEND ═══ -->
  <rect x="40" y="640" width="1120" height="140" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="600" y="664" text-anchor="middle" fill="#666" font-size="11" font-weight="600" letter-spacing="2">PROTOCOL &amp; CONNECTION GUIDE</text>

  <!-- Connection types -->
  <g>
    <line x1="80" y1="690" x2="130" y2="690" stroke="#2a6" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="140" y="694" fill="#888" font-size="10">Ethernet (CAT5/6) — wired, reliable, low latency</text>
  </g>
  <g>
    <line x1="80" y1="712" x2="130" y2="712" stroke="#a4c" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="140" y="716" fill="#888" font-size="10">WiFi — phones, tablets, remote controls</text>
  </g>
  <g>
    <line x1="80" y1="734" x2="130" y2="734" stroke="#886" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="140" y="738" fill="#888" font-size="10">USB — MIDI controllers, direct connection</text>
  </g>
  <g>
    <line x1="80" y1="756" x2="130" y2="756" stroke="#555" stroke-width="1.5"/>
    <text x="140" y="760" fill="#888" font-size="10">HDMI — video output to projectors / LED walls</text>
  </g>

  <!-- Port info -->
  <g>
    <text x="650" y="694" fill="#4d8" font-size="10" font-weight="600">:5173</text>
    <text x="700" y="694" fill="#888" font-size="10">Vite HTTP — serves all pages (editor, output, remote, executor)</text>
  </g>
  <g>
    <text x="650" y="716" fill="#4d8" font-size="10" font-weight="600">:9100</text>
    <text x="700" y="716" fill="#888" font-size="10">WebSocket — real-time state sync between all machines</text>
  </g>
  <g>
    <text x="650" y="738" fill="#888" font-size="10">All outputs receive full state at 30fps via WebSocket</text>
  </g>
  <g>
    <text x="650" y="760" fill="#888" font-size="10">No limit on number of outputs — add machines as needed</text>
  </g>
</svg>
